version: '3.3'

services:
  mysqldb:
    container_name: mysqldb
    image: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: connectmessenger
    networks:
      springboot-mysql-react-net:
    volumes:
      - connect-messenger-java_connectmessenger:/var/lib/mysql

  springboot:
    container_name: springboot
    image: rustyripper/connect-messenger-java4
    ports:
      - "8080:8080"
    networks:
      springboot-mysql-react-net:
    restart: on-failure

  react:
    restart: always
    container_name: react
    image: rustyripper/connect-messenger-react4
    ports:
      - "3000:3000"
    stdin_open: true
    networks:
      springboot-mysql-react-net:
    depends_on:
      - springboot

networks:
  springboot-mysql-react-net:

volumes:
  connect-messenger-java_connectmessenger:
    external: true
