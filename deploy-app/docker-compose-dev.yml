version: '3.3'

services:
  springboot:
    container_name: springboot
    image: rustyripper/connect-messenger-java4
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://terraform-20241111110009996200000002.c3u7pg5zqr6k.us-east-1.rds.amazonaws.com:3306/connectmessenger
      SPRING_DATASOURCE_USERNAME:
      SPRING_DATASOURCE_PASSWORD:
      APP_URL:
      COGNITO_CLIENT_ID:
      COGNITO_CLIENT_SECRET:
      COGNITO_SCOPE: openid,email
      COGNITO_CLIENT_NAME: my_app_client_terraform
      COGNITO_ISSUER_URI:
    restart: on-failure

  react:
    restart: always
    container_name: react
    image: rustyripper/connect-messenger-react4
    ports:
      - "3000:3000"
    environment:
      REACT_APP_URL: 3.239.19.234.nip.io
    stdin_open: true
    depends_on:
      - springboot
